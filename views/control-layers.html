<style>
  :root{

    --dim:#a3ada1;
    --green:#3dff8b;

  *{box-sizing:border-box}
  html{background:var(--ink)}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);margin:0;line-height:1.4;-webkit-font-smoothing:antialiased}
  .page{max-width:1720px;margin:0 auto;padding:16px 26px 16px}

  .head p{font-family:var(--mono);font-size:12px;color:var(--dim);margin:0;letter-spacing:.02em}
  .head .tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}

  figure{margin:10px 0 0}
  svg{display:block;width:100%;height:auto;max-width:100%;max-height:calc(100vh - 150px);margin:0 auto;color:var(--text);font-family:var(--mono)}

  .g b{color:var(--green)} .b b{color:var(--orange)} .a b{color:var(--amber)} .v b{color:var(--bone)}

  .head .back{margin-left:18px;font-family:var(--mono);font-size:12px;color:var(--green);text-decoration:none;letter-spacing:.02em;display:inline-block;padding:12px 0}
  .head .back:hover{text-decoration:underline}
  @media (max-width:900px){svg{max-height:none;min-width:1100px} figure{overflow-x:auto;-webkit-overflow-scrolling:touch} .head{gap:6px 14px} .head p::after{content:". Scroll sideways to see the whole drawing.";color:var(--bone)}}
  @media (max-width:600px){figcaption{grid-template-columns:1fr}}
  body{--cd-panel-top:16px}
.cd-node { cursor: pointer; outline: none; }
.cd-node rect { pointer-events: all; transition: stroke .15s, stroke-width .15s; }
.cd-node:hover rect, .cd-node:focus-visible rect, .cd-node.active rect { stroke: #3dff8b; stroke-width: 3; }
.cd-view-hint { flex-basis: 100%; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #e8dcc0; }
.cd-node-panel { display: none; position: fixed; top: var(--cd-panel-top, 84px); right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); overflow: auto; z-index: 900; background: #0a0d0b; border: 1px solid #3dff8b; padding: 16px 20px 20px; color: #e6ebe4; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55; }
.cd-node-panel.open { display: block; }
.cd-node-panel.left { right: auto; left: 16px; }
.cd-node-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.cd-node-zone { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #a3ada1; }
.cd-node-close { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3dff8b; background: none; border: 1px solid #27342b; padding: 4px 10px; cursor: pointer; }
.cd-node-close:hover, .cd-node-close:focus-visible { border-color: #3dff8b; outline: none; }
.cd-node-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 20px; font-weight: 600; margin: 0 0 8px; color: #e6ebe4; line-height: 1.25; }
.cd-node-what { margin: 0 0 14px; color: #e6ebe4; }
.cd-node-status { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin: 0 0 14px; padding: 10px 12px; border: 1px solid #27342b; }
.cd-node-status b { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #e6ebe4; }
.cd-node-dot { width: 9px; height: 9px; border-radius: 50%; background: #a3ada1; display: inline-block; }
.cd-node-dot.live, .cd-node-dot.implemented { background: #3dff8b; } .cd-node-dot.partial, .cd-node-dot.partially-implemented { background: #ffc247; } .cd-node-dot.designed, .cd-node-dot.planned { background: #e8dcc0; }
.cd-node-status .cd-node-note { grid-column: 1 / -1; color: #a3ada1; font-size: 13px; }
.cd-node-panel h5 { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #a3ada1; margin: 14px 0 6px; font-weight: 700; }
.cd-node-panel ul { list-style: none; margin: 0; padding: 0; }
.cd-node-panel li { padding: 5px 0; border-top: 1px solid #1b241e; font-size: 13px; }
.cd-node-panel a { color: #3dff8b; text-decoration: none; } .cd-node-panel a:hover, .cd-node-panel a:focus-visible { text-decoration: underline; }
.cd-node-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-right: 6px; }
.cd-node-controls em { display: block; font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a3ada1; }
.cd-node-path { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a3ada1; word-break: break-all; }
html.light .cd-node-panel { background: #0a0d0b; color: #e6ebe4; } html.light .cd-node-panel a { color: #3dff8b; } html.light .cd-node-title, html.light .cd-node-what, html.light .cd-node-status b { color: #e6ebe4; } html.light .cd-view-hint { color: #e8dcc0; }
@media (max-width: 900px) { .cd-node-panel, .cd-node-panel.left { top: auto; right: 0; left: 0; bottom: 0; width: auto; max-height: 62vh; border-width: 1px 0 0; padding: 14px 16px 18px; } }
.cd-packet { pointer-events: none; opacity: .9; stroke-dashoffset: var(--cdlen); }
@keyframes cdpacket { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .cd-packet { display: none; } }

<div class="page">
  <div class="head">
    <h1>CoreDirective reference architecture</h1>
    <p>seven barrier layers on one hardened host, moderate baseline, sanitized, no addresses, ports, or versions</p>
    <span class="tag">Control layers</span><a class="back" href="../#view-control-layers">Back to portfolio</a><span class="cd-view-hint">Click a box for what it is, the controls it carries, its status today, and the file that proves it.</span>

  <figure>
  <svg viewBox="0 0 1700 788" role="img" aria-label="Control layers view of the CoreDirective platform. Seven horizontal bands, edge, host, runtime, application, identity, data, and delivery. Each band names the barriers at that layer and the NIST 800-53 Revision 5 control identifiers they satisfy, as cited in the system security plan. Edge: identity checked before the origin, WAF with custom and managed rules, DDoS absorption, per-IP rate limits on the webhook path, and no origin address in DNS. Host: an outbound-only tunnel, services published to loopback, one inbound port, break-glass SSH from an allowlisted source, a CIS baseline with documented exceptions, no-new-privileges on 18 of 19 services, and resource limits. Runtime: a kernel sensor below the workloads, three bridge networks with one that has no internet route, read-only roots on the tunnel and alert router, digest pinning with review tiers, and alerts shipped off-host into the incident handling pipeline. Application: input and output rails, a typed actions allowlist, a per-alert spend ceiling with a daily cap, tracing of every call, a rotated shared-secret webhook token, and human review for high severity. Identity: OIDC realm roles, MFA on every session, just-in-time elevation that expires, recorded sessions, short-lived credentials from Vault, and lockout. Data: a bridge-only database, customer managed key encryption on state and backups, versioned state and retention-ruled backups in object storage, nightly backups by instance principal, and a monthly timed restore. Delivery: pull request only, OIDC token exchange, scanners, eight policy gates, signature verification of upstream images, human review, and a nightly drift check.">

"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AC-3","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"329"}]},{"id":"ctl-AC-4","label":"AC-4","title":"AC-4 Information Flow Enforcement","zone":"NIST 800-53 Rev 5","what":"Information flow is enforced through Docker network segmentation. All services communicate over three segmented Docker bridge networks (net-core, net-ai, net-monitoring). svc-tunnel is the sole ingress path (host networking). No container ports are bound to the host's public interface. Egress is unrestricted for operational requirements (API integrations, telemetry).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AC-4","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"330"}]},{"id":"ctl-AC-6","label":"AC-6","title":"AC-6 Least Privilege","zone":"NIST 800-53 Rev 5","what":"Containers run with no-new-privileges security option (18 of 19 services). svc-detection requires SYS_ADMIN capability for eBPF - this is an accepted risk with compensating controls (apparmor:unconfined is documented, all other capabilities are dropped via cap_drop: ALL). Resource limits (CPU, memory, PIDs) are enforced on all containers. JIT access via svc-gateway grants elevated privileges with 4-hour TTL auto-expiration.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AC-6","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"332"}]},{"id":"ctl-AC-7","label":"AC-7","title":"AC-7 Unsuccessful Logon Attempts","zone":"NIST 800-53 Rev 5","what":"svc-identity enforces lockout policy after failed authentication attempts. Failed SSH login attempts are monitored by svc-monitor with alerting configured at 5 (warning) and 10 (critical) failures within a 5-minute window. svc-gateway records all authentication events.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AC-7","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"333"}]},{"id":"ctl-AC-12","label":"AC-12","title":"AC-12 Session Termination","zone":"NIST 800-53 Rev 5","what":"svc-gateway enforces session TTL with automatic termination. JIT-elevated sessions expire after 4 hours. svc-identity enforces OIDC token expiration and refresh token limits. Idle session timeout is configured in svc-automation.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AC-12","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"338"}]},{"id":"ctl-AU-2","label":"AU-2","title":"AU-2 Event Logging","zone":"NIST 800-53 Rev 5","what":"The following events are logged: (1) Authentication success/failure (identity provider admin events, svc-gateway user.login); (2) SSH session start/end with full session recording (svc-gateway); (3) Privilege escalation and access request events (svc-gateway access_request.*); (4) Container lifecycle events (svc-monitor); (5) Syscall-level security events (svc-detection); (6) Failed SSH login attempts (host auth.log ingested by svc-monitor); (7) Database connection metrics (PostgreSQL integration).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AU-2","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"347"}]},{"id":"ctl-AU-12","label":"AU-12","title":"AU-12 Audit Record Generation","zone":"NIST 800-53 Rev 5","what":"Audit records are generated by four independent subsystems: (1) svc-gateway generates SSH session events via gRPC to svc-event-shipper; (2) svc-detection generates syscall-level events via detection rules to svc-detection-router; (3) svc-monitor collects container and host logs via Docker socket (read-only mount); (4) Each service generates application-level logs captured by the Docker JSON log driver. All four subsystems operate independently - failure of one does not affect the others.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row AU-12","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"358"}]},{"id":"ctl-CA-7","label":"CA-7","title":"CA-7 Continuous Monitoring","zone":"NIST 800-53 Rev 5","what":"Continuous monitoring is implemented through: (1) Real-time container and host metrics via svc-monitor; (2) Real-time syscall detection via svc-detection; (3) Automated CI/CD security scanning on every commit; (4) Terraform health checks validating service reachability; (5) Seven Terraform-managed monitors with threshold-based alerting and automated notification; (6) SOC dashboard with five operational views. See Section 6 for the full continuous monitoring strategy.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CA-7","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"371"}]},{"id":"ctl-CM-3","label":"CM-3","title":"CM-3 Configuration Change Control","zone":"NIST 800-53 Rev 5","what":"All configuration changes follow a controlled process: (1) Changes are submitted as pull requests; (2) terraform-pr.yml runs 7 automated checks (fmt, init, validate, lint, IaC compliance scan, plan, OPA); (3) PR comment auto-generated with pass/fail status for each check; (4) Merge to main triggers security scanning then automated terraform apply; (5) prevent_destroy lifecycle rules protect critical resources from accidental deletion.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CM-3","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"381"}]},{"id":"ctl-CM-4","label":"CM-4","title":"CM-4 Impact Analyses","zone":"NIST 800-53 Rev 5","what":"Terraform plan output is generated and displayed in PR comments for every infrastructure change. The plan shows resources to be created, modified, or destroyed. Infrastructure policies evaluate the plan JSON to deny high-risk changes (public firewall rules, missing encryption, production resource deletion, root SSH keys). Checkov performs CIS benchmark analysis against proposed changes.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CM-4","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"382"}]},{"id":"ctl-CM-5","label":"CM-5","title":"CM-5 Access Restrictions for Change","zone":"NIST 800-53 Rev 5","what":"Repository branch protection requires PR review before merge to main. CI/CD secrets are stored in encrypted repository secrets (not accessible to forks or PRs from external contributors). Terraform apply only executes on merge to main after security scan passes. SSH access to the production VPS requires key-based authentication.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CM-5","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"383"}]},{"id":"ctl-CM-6","label":"CM-6","title":"CM-6 Configuration Settings","zone":"NIST 800-53 Rev 5","what":"Container security settings are standardized: (1) no-new-privileges: true on 18/19 containers; (2) Resource limits (CPU, memory, PIDs) on all containers; (3) Log rotation (10MB max, 3 files) on all containers; (4) Health checks on all containers; (5) Read-only rootfs on svc-tunnel and svc-detection-router; (6) cap_drop: ALL + minimum required capabilities on svc-detection. Deviations are documented as accepted risks with compensating controls.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CM-6","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"384"}]},{"id":"ctl-CM-7","label":"CM-7","title":"CM-7 Least Functionality","zone":"NIST 800-53 Rev 5","what":"Each container runs a single service with a defined purpose. No container includes development tools, compilers, or package managers beyond what the upstream image provides. svc-detection-router and svc-tunnel use read-only root filesystems with tmpfs for required writable paths. PID limits prevent fork bombs. APM is explicitly disabled on svc-monitor (DD_APM_ENABLED=false) as it is not needed.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CM-7","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"385"}]},{"id":"ctl-CM-8","label":"CM-8","title":"CM-8 System Component Inventory","zone":"NIST 800-53 Rev 5","what":"The system component inventory is maintained through: (1) docker-compose.yaml as the authoritative service manifest (19 services with pinned images); (2) Terraform state as the authoritative cloud resource inventory; (3) SBOM generation (SPDX-JSON) for the repository and 6 container images on every merge to main, with 90-day artifact retention.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CM-8","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"386"}]},{"id":"ctl-CP-4","label":"CP-4","title":"CP-4 Contingency Plan Testing","zone":"NIST 800-53 Rev 5","what":"Tabletop exercise validates contingency plan procedures including detection, containment, eradication, and recovery phases. Individual service recovery validated through operational restart procedures.","status":"partially-implemented","status_label":"Partially Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CP-4","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"397"}]},{"id":"ctl-CP-6","label":"CP-6","title":"CP-6 Alternate Storage Site","zone":"NIST 800-53 Rev 5","what":"Terraform state is stored in versioned object storage (remote backend with versioning enforced by infrastructure policy). Database backups are mounted to a dedicated backup volume (CD_BACKUPS). Off-site backup replication is planned but not yet implemented.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CP-6","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"398"}]},{"id":"ctl-CP-9","label":"CP-9","title":"CP-9 System Backup","zone":"NIST 800-53 Rev 5","what":"PostgreSQL backups are stored in the CD_BACKUPS volume. Terraform state is versioned in remote object storage. Docker volumes for persistent data (svc-db, svc-automation, svc-secrets, svc-gateway) are on local disk. Automated scheduled backup with off-site replication is planned. Infrastructure policy warns when VPS backups are not enabled.","status":"partially-implemented","status_label":"Partially Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CP-9","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"400"}]},{"id":"ctl-CP-10","label":"CP-10","title":"CP-10 System Recovery and Reconstitution","zone":"NIST 800-53 Rev 5","what":"The IaC codebase, Docker Compose definitions, and identity provider realm export enable full platform reconstitution from source control. prevent_destroy lifecycle rules on critical Terraform resources protect against accidental deletion. Recovery to a known-good state requires: (1) terraform apply for cloud resources; (2) docker compose up -d for services; (3) Database restore from backup; (4) Re-import svc-identity realm.","status":"partially-implemented","status_label":"Partially Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row CP-10","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"401"}]},{"id":"ctl-IA-2","label":"IA-2","title":"IA-2 Identification and Authentication (Organizational Users)","zone":"NIST 800-53 Rev 5","what":"Users authenticate through svc-identity (identity provider) for web access and svc-gateway (Teleport) for SSH access. Both systems require unique user accounts. SSH access requires Ed25519 key-based authentication. svc-gateway enforces TOTP as a mandatory second factor for all users.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row IA-2","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"410"}]},{"id":"ctl-IA-2(1)","label":"IA-2(1)","title":"IA-2(1) Multi-Factor Authentication to Privileged Accounts","zone":"NIST 800-53 Rev 5","what":"svc-gateway enforces TOTP MFA for all SSH access (second_factor: otp). JIT privilege escalation requires explicit access request approval in addition to existing MFA. Admin access to svc-identity requires authenticated session.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row IA-2(1)","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"411"}]},{"id":"ctl-IA-5","label":"IA-5","title":"IA-5 Authenticator Management","zone":"NIST 800-53 Rev 5","what":"Authenticator management is implemented through: (1) svc-identity password policies (minimum length, complexity, expiration); (2) SSH key management via Terraform (Ed25519 keys only); (3) TOTP seed generation and binding in svc-gateway; (4) API keys managed through external secrets manager with injection at runtime; (5) No secrets hardcoded in source - enforced by Gitleaks in CI/CD.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row IA-5","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"415"}]},{"id":"ctl-IR-4","label":"IR-4","title":"IR-4 Incident Handling","zone":"NIST 800-53 Rev 5","what":"Automated incident handling is implemented through the SOAR pipeline: (1) svc-detection generates syscall-level alerts; (2) svc-monitor generates infrastructure and security alerts; (3) Seven Terraform-managed monitors with severity-tiered thresholds; (4) Webhook relay routes alerts to SOAR engine; (5) SOAR engine relays to messaging platform with severity filtering; (6) DND downtime schedule mutes warning/error alerts 10 PM - 8:30 AM ET while critical alerts always notify.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row IR-4","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"429"}]},{"id":"ctl-RA-5","label":"RA-5","title":"RA-5 Vulnerability Monitoring and Scanning","zone":"NIST 800-53 Rev 5","what":"Vulnerability scanning is automated through: (1) CVE scanner filesystem and dependency scanning (CRITICAL/HIGH severity, fail-on-findings) on every push and PR; (2) SAST scanner with security-audit, secrets, docker, and terraform rulesets; (3) Secrets scanner full-history secret scanning; (4) Checkov CIS benchmark scanning for Terraform configurations; (5) Container image digest manifest generation for provenance tracking; (6) CIS Docker Bench results tracked on SOC dashboard. Findings are uploaded to GitHub Security tab (SARIF format).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row RA-5","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"505"}]},{"id":"ctl-SA-8","label":"SA-8","title":"SA-8 Security and Privacy Engineering Principles","zone":"NIST 800-53 Rev 5","what":"The platform is designed around: (1) Defense in depth (4 independent audit subsystems); (2) Least privilege (no-new-privileges, resource limits, JIT access); (3) Fail-safe defaults (health checks gate service dependencies, prevent_destroy on critical resources); (4) Complete mediation (zero-trust tunnel as sole ingress); (5) Economy of mechanism (single-purpose containers); (6) Separation of privilege (3-tier RBAC).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SA-8","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"518"}]},{"id":"ctl-SA-11","label":"SA-11","title":"SA-11 Developer Testing and Evaluation","zone":"NIST 800-53 Rev 5","what":"Security testing is integrated into the development pipeline: (1) CVE scanner for vulnerability scanning; (2) SAST scanner for static analysis; (3) Secrets scanner for secrets detection; (4) Checkov for CIS compliance; (5) policy engine for custom security policies; (6) Terraform validate and Terraform linter for configuration correctness; (7) container signing tool for supply chain integrity.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SA-11","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"521"}]},{"id":"ctl-SC-5","label":"SC-5","title":"SC-5 Denial-of-Service Protection","zone":"NIST 800-53 Rev 5","what":"DoS protection is implemented at multiple layers: (1) Cloud firewall restricts inbound to ICMP and SSH only; (2) Zero-trust tunnel provider applies DDoS mitigation at its edge; (3) Container resource limits (CPU, memory, PIDs) prevent individual service exhaustion from cascading; (4) Health checks and automatic restarts (restart: unless-stopped) recover from transient failures; (5) Container down monitor alerts when running count drops.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-5","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"533"}]},{"id":"ctl-SC-6","label":"SC-6","title":"SC-6 Resource Availability","zone":"NIST 800-53 Rev 5","what":"Resource availability is enforced through container-level resource limits on all Compose-managed services. CPU shares, memory limits, and PID limits are defined in deploy.resources blocks, preventing any single service from exhausting host resources and impacting availability of other services.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-6","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"544"}]},{"id":"ctl-SC-7","label":"SC-7","title":"SC-7 Boundary Protection","zone":"NIST 800-53 Rev 5","what":"Network boundary protection is implemented through: (1) Cloud firewall as the outermost perimeter; (2) Zero-trust tunnel as the sole public ingress path - no application ports exposed directly; (3) Three segmented Docker bridge networks (net-core, net-ai, net-monitoring) isolating services by function and limiting lateral movement; (4) svc-tunnel is the only container with host networking; (5) Infrastructure policy denies firewall rules allowing public inbound on non-HTTPS ports (SSH exception documented as accepted risk).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-7","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"534"}]},{"id":"ctl-SC-8","label":"SC-8","title":"SC-8 Transmission Confidentiality and Integrity","zone":"NIST 800-53 Rev 5","what":"All data in transit is encrypted: (1) Zero-trust tunnel provides TLS for web traffic ingress; (2) SSH sessions use Ed25519 key exchange; (3) mTLS (mutual TLS with client certificate authentication) secures the svc-gateway event pipeline (svc-event-shipper to Fluentd); (4) HTTPS for all outbound API calls to Datadog, secrets manager, and AI providers; (5) svc-gateway proxy encrypts all proxied SSH connections.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-8","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"535"}]},{"id":"ctl-SC-12","label":"SC-12","title":"SC-12 Cryptographic Key Establishment and Management","zone":"NIST 800-53 Rev 5","what":"Cryptographic keys are managed through: (1) SSH keys managed via Terraform (cloud_ssh_key resource); (2) svc-automation encryption key stored in secrets manager; (3) svc-gateway identity certificates with defined TTL (1-year for event-handler); (4) mTLS certificates for event pipeline; (5) Secrets engine unseal keys stored in credential vault (biometric-locked). No keys are stored in source code - secrets scanner enforcement in CI.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-12","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"537"}]},{"id":"ctl-SC-13","label":"SC-13","title":"SC-13 Cryptographic Protection","zone":"NIST 800-53 Rev 5","what":"The system uses industry-standard cryptographic mechanisms: (1) TLS 1.2+ for all HTTPS connections; (2) Ed25519 for SSH key authentication; (3) mTLS with X.509 certificates for event pipeline; (4) AES-256 encryption at rest by DigitalOcean (block storage and object storage).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-13","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"538"}]},{"id":"ctl-SC-28","label":"SC-28","title":"SC-28 Protection of Information at Rest","zone":"NIST 800-53 Rev 5","what":"Data at rest is protected through: (1) Cloud provider encrypts all block storage (SSD) and object storage at rest by default; (2) svc-secrets (secrets engine) encrypts its data directory; (3) .env file on the host is chmod 600 (root-only); (4) Infrastructure policy enforces versioning on object storage buckets (data integrity safeguard); (5) Terraform state backend uses provider-encrypted storage with versioning.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SC-28","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"543"}]},{"id":"ctl-SI-3","label":"SI-3","title":"SI-3 Malicious Code Protection","zone":"NIST 800-53 Rev 5","what":"Malicious code protection is implemented through: (1) svc-detection (Falco) provides real-time eBPF-based syscall monitoring, detecting privilege escalation, sensitive file reads, and container exec events; (2) Secrets scanner scans full commit history for leaked secrets; (3) SAST scanner detects malicious patterns in code; (4) Container images are verified via container signing tool signatures; (5) svc-detection-router and svc-tunnel use read-only rootfs preventing runtime filesystem modification.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SI-3","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"559"}]},{"id":"ctl-SI-4","label":"SI-4","title":"SI-4 System Monitoring","zone":"NIST 800-53 Rev 5","what":"System monitoring operates at four levels: (1) **Infrastructure**: svc-monitor collects host CPU, memory, disk, network metrics and container stats; (2) **Application**: Container health checks, PostgreSQL connection monitoring, svc-automation restart tracking; (3) **Security**: svc-detection eBPF syscall monitoring, failed SSH login detection, access gateway audit event streaming; (4) **Compliance**: CIS Docker Bench results tracked on SOC dashboard. Seven Terraform-managed monitors provide threshold-based alerting with automated notification. SOC dashboard provides real-time operational visibility across five panels.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SI-4","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"560"}]},{"id":"ctl-SI-7","label":"SI-7","title":"SI-7 Software, Firmware, and Information Integrity","zone":"NIST 800-53 Rev 5","what":"Software integrity is verified through: (1) Container signature verification for upstream container images in CI/CD; (2) Image digest manifest generation for all deployed images; (3) SBOM generation (SPDX-JSON) for repository and 6 container images with 90-day retention; (4) Infrastructure policy prevents deletion of production resources (prevent_destroy); (5) Object storage versioning prevents audit log overwrites (enforced by infrastructure policy).","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SI-7","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"563"}]},{"id":"ctl-SI-10","label":"SI-10","title":"SI-10 Information Input Validation","zone":"NIST 800-53 Rev 5","what":"Input validation is enforced through: (1) Terraform variable validation with postconditions (VPC CIDR, VPS status, IPv4 assignment); (2) infrastructure policies validate plan inputs against security constraints; (3) Application-level input validation is delegated to individual services (svc-identity, svc-automation); (4) **Pre-graph PII scanner** (added 2026-04-23) runs before Squire LLM graph invocation, scanning raw /alert payloads for SSN (regex + context), Luhn-valid credit card, email, and US phone. On detection, the scanner returns a structured block with reason_code=PII_DETECTED_PRE_GRAPH, rail_name=pre_graph, at 0ms and zero token cost. This closes the rail-architecture gap where the NeMo input rail only fronts draft and critique LLM calls. Cross-maps to OWASP LLM06 (Sensitive Information Disclosure) and CSA Agentic MG-4.1. Framework: NIST AI RMF MAP-4.1 and MANAGE-4.1.","status":"implemented","status_label":"Implemented","status_note":"Status as recorded in the System Security Plan, section 5; the open items behind it sit on the POA&M.","controls":[],"evidence":[{"label":"SSP row SI-10","path":"docs/grc/SSP_SYSTEM_SECURITY_PLAN.md","line":"565"}]}]</script>

// ANIMATED FLOW: packets ride every arrow in the architecture views
(function() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.cd-view-frame svg, figure > svg').forEach(function(svg) {
    svg.querySelectorAll('line[marker-end], path[marker-end], polyline[marker-end]').forEach(function(el, i) {
      var len = el.getTotalLength ? el.getTotalLength() : 0; if (!len || len < 24) return;
      var c = el.cloneNode(false);
      ['marker-end', 'marker-start', 'stroke-dasharray', 'id'].forEach(function(a) { c.removeAttribute(a); });
      c.setAttribute('class', 'cd-packet');
      c.setAttribute('stroke-width', String(parseFloat(el.getAttribute('stroke-width') || '1.5') + 1.2));
      c.setAttribute('stroke-linecap', 'round');
      c.setAttribute('stroke-dasharray', '5 ' + Math.ceil(len + 5));
      c.style.setProperty('--cdlen', String(Math.ceil(len + 10)));
      c.style.animation = 'cdpacket ' + Math.max(1.8, len / 80).toFixed(2) + 's linear ' + (-(i % 9) * 0.4).toFixed(2) + 's infinite';
      el.parentNode.insertBefore(c, el.nextSibling);
    });
  });
})();

    close.type = 'button'; close.setAttribute('aria-label', 'Close details'); bar.appendChild(zone); bar.appendChild(close);
    var title = el('h4', 'cd-node-title'); title.id = 'cd-node-title';
    var what = el('p', 'cd-node-what');
    var status = el('div', 'cd-node-status'), dot = el('span', 'cd-node-dot'), slabel = el('b'), note = el('span', 'cd-node-note');
    status.appendChild(dot); status.appendChild(slabel); status.appendChild(note);
    var controls = el('ul', 'cd-node-controls'), evidence = el('ul', 'cd-node-evidence'), hc = el('h5', null, 'Controls');
    [bar, title, what, status, hc, controls, el('h5', null, 'Evidence'), evidence].forEach(function(n) { panel.appendChild(n); });
    parts = { zone: zone, title: title, what: what, dot: dot, slabel: slabel, note: note, controls: controls, hc: hc, evidence: evidence, close: close };
    close.addEventListener('click', hide);
    document.body.appendChild(panel);
  }
  function show(node, g) {
    if (!panel) build();
    parts.zone.textContent = node.zone; parts.title.textContent = node.title || node.label; parts.what.textContent = node.what;
    parts.dot.className = 'cd-node-dot ' + node.status; parts.slabel.textContent = node.status_label || LABEL[node.status] || node.status; parts.note.textContent = node.status_note;
    parts.controls.textContent = ''; parts.hc.style.display = node.controls.length ? '' : 'none';
    node.controls.forEach(function(c) {
      var li = el('li'); li.appendChild(link(SSP + '#L' + c.line, c.id, 'cd-node-id')); li.appendChild(el('span', null, c.name)); li.appendChild(el('em', null, 'SSP: ' + c.status)); parts.controls.appendChild(li);
    });
    parts.evidence.textContent = '';
    node.evidence.forEach(function(e) {
      var li = el('li'); li.appendChild(link(REPO + e.path + anchor(e.line), e.label)); li.appendChild(el('span', 'cd-node-path', e.path + ':' + e.line)); parts.evidence.appendChild(li);
    });
    if (active) active.classList.remove('active');
    // open on the side away from the box, so the box and its neighbours stay visible
    var r = g.getBoundingClientRect(); panel.classList.toggle('left', (r.left + r.width / 2) > window.innerWidth / 2);
    active = g; g.classList.add('active'); panel.classList.add('open'); parts.close.focus();
  }
  function hide() {
    if (!panel || !panel.classList.contains('open')) return;
    panel.classList.remove('open'); var g = active; if (g) g.classList.remove('active'); active = null; if (g && g.focus) g.focus();
  }
  document.querySelectorAll('script[type="application/json"][id^="cd-nodes-"]').forEach(function(s) {
    var data; try { data = JSON.parse(s.textContent); } catch (e) { return; }
    var fig = s.closest('figure'); if (!fig) return;
    var byId = {}; data.forEach(function(n) { byId[n.id] = n; });
    fig.querySelectorAll('.cd-node').forEach(function(g) {
      var n = byId[g.getAttribute('data-node')]; if (!n) return;
      function toggle(e) { e.preventDefault(); e.stopPropagation(); if (active === g) hide(); else show(n, g); }
      g.addEventListener('click', toggle);
      g.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') toggle(e); });
    });
  });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hide(); });
  document.addEventListener('click', function(e) { if (panel && panel.classList.contains('open') && !panel.contains(e.target) && !(active && active.contains(e.target))) hide(); });
})();
</script>
</body>
</html>
