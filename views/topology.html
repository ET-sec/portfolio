<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none';">
<link rel="icon" href="../favicon.svg">
<title>CoreDirective Topology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --ink:#0a0d0b;
    --node:#141b16;
    --line:#27342b;
    --line-soft:#1b241e;
    --text:#e6ebe4;
    --dim:#a3ada1;
    --green:#3dff8b;
    --orange:#ff9b3d;
    --amber:#ffc247;
    --bone2:#e8dcc0;
    --red:#ff6b5e;
    --bone:#e8dcc0;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--ink)}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);margin:0;line-height:1.4;-webkit-font-smoothing:antialiased}
  .page{max-width:1720px;margin:0 auto;padding:16px 26px 22px}

  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
  .head h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
  .head p{font-family:var(--mono);font-size:12px;color:var(--dim);margin:0;letter-spacing:.02em}
  .head .tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}

  figure{margin:10px 0 0}
  svg{display:block;width:100%;height:auto;max-width:100%;max-height:calc(100vh - 150px);margin:0 auto;color:var(--text);font-family:var(--mono)}
  figcaption{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px 22px;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);
    font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.01em;
  }
  @media (max-width:1100px){figcaption{grid-template-columns:repeat(2,1fr)}}
  figcaption b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;font-weight:700}
  .g b{color:var(--green)} .b b{color:var(--orange)} .a b{color:var(--amber)} .v b{color:var(--bone)}

  .head .back{margin-left:18px;font-family:var(--mono);font-size:12px;color:var(--green);text-decoration:none;letter-spacing:.02em;display:inline-block;padding:12px 0}
  .head .back:hover{text-decoration:underline}
  @media (max-width:900px){svg{max-height:none;min-width:1100px} figure{overflow-x:auto;-webkit-overflow-scrolling:touch} .head{gap:6px 14px} .head p::after{content:". Scroll sideways to see the whole drawing.";color:var(--bone)}}
  @media (max-width:600px){figcaption{grid-template-columns:1fr}}
  body{--cd-panel-top:16px}
.cd-node { cursor: pointer; outline: none; }
.cd-node rect { pointer-events: all; transition: stroke .15s, stroke-width .15s; }
.cd-node:hover rect, .cd-node:focus-visible rect, .cd-node.active rect { stroke: #3dff8b; stroke-width: 3; }
.cd-view-hint { flex-basis: 100%; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #e8dcc0; }
.cd-node-panel { display: none; position: fixed; top: var(--cd-panel-top, 84px); right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); overflow: auto; z-index: 900; background: #0a0d0b; border: 1px solid #3dff8b; padding: 16px 20px 20px; color: #e6ebe4; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55; }
.cd-node-panel.open { display: block; }
.cd-node-panel.left { right: auto; left: 16px; }
.cd-node-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.cd-node-zone { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #a3ada1; }
.cd-node-close { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3dff8b; background: none; border: 1px solid #27342b; padding: 4px 10px; cursor: pointer; }
.cd-node-close:hover, .cd-node-close:focus-visible { border-color: #3dff8b; outline: none; }
.cd-node-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 20px; font-weight: 600; margin: 0 0 8px; color: #e6ebe4; line-height: 1.25; }
.cd-node-what { margin: 0 0 14px; color: #e6ebe4; }
.cd-node-status { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin: 0 0 14px; padding: 10px 12px; border: 1px solid #27342b; }
.cd-node-status b { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #e6ebe4; }
.cd-node-dot { width: 9px; height: 9px; border-radius: 50%; background: #a3ada1; display: inline-block; }
.cd-node-dot.live, .cd-node-dot.implemented { background: #3dff8b; } .cd-node-dot.partial, .cd-node-dot.partially-implemented { background: #ffc247; } .cd-node-dot.designed, .cd-node-dot.planned { background: #e8dcc0; }
.cd-node-status .cd-node-note { grid-column: 1 / -1; color: #a3ada1; font-size: 13px; }
.cd-node-panel h5 { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #a3ada1; margin: 14px 0 6px; font-weight: 700; }
.cd-node-panel ul { list-style: none; margin: 0; padding: 0; }
.cd-node-panel li { padding: 5px 0; border-top: 1px solid #1b241e; font-size: 13px; }
.cd-node-panel a { color: #3dff8b; text-decoration: none; } .cd-node-panel a:hover, .cd-node-panel a:focus-visible { text-decoration: underline; }
.cd-node-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-right: 6px; }
.cd-node-controls em { display: block; font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a3ada1; }
.cd-node-path { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a3ada1; word-break: break-all; }
html.light .cd-node-panel { background: #0a0d0b; color: #e6ebe4; } html.light .cd-node-panel a { color: #3dff8b; } html.light .cd-node-title, html.light .cd-node-what, html.light .cd-node-status b { color: #e6ebe4; } html.light .cd-view-hint { color: #e8dcc0; }
@media (max-width: 900px) { .cd-node-panel, .cd-node-panel.left { top: auto; right: 0; left: 0; bottom: 0; width: auto; max-height: 62vh; border-width: 1px 0 0; padding: 14px 16px 18px; } }
.cd-packet { pointer-events: none; opacity: .9; stroke-dashoffset: var(--cdlen); }
@keyframes cdpacket { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .cd-packet { display: none; } }
</style>
</head>
<body>

<div class="page">
  <div class="head">
    <h1>CoreDirective reference architecture</h1>
    <p>one hardened host, 19 services, three trust segments, sanitized, no addresses, ports, or versions</p>
    <span class="tag">Topology and flows</span><a class="back" href="../#view-topology">Back to portfolio</a><span class="cd-view-hint">Click a box for what it is, the controls it carries, its status today, and the file that proves it.</span>
  </div>

  <figure>
  <svg viewBox="0 0 1700 790" role="img" aria-label="Reference topology of the CoreDirective platform. Users reach services through Cloudflare Access and WAF over a tunnel the host dials outbound, so no application port listens publicly. Inside the host, three bridge networks separate core services, a sealed AI inference segment with no internet route, and a monitoring segment. The SOC agent's model calls pass through a guardrails container before leaving the host, with a local model as fallback on the sealed segment. Falco reads kernel syscalls and ships alerts to Datadog; Teleport session events leave over mTLS. State and backups are encrypted with a customer managed key in retention-locked object storage. Infrastructure changes arrive only through a pipeline with OIDC credentials, OPA policy gates, human review, and a nightly drift check. One inbound port remains: SSH from an allowlisted source range as break-glass.">
    <defs>
      <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dff8b"/></marker>
      <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9b3d"/></marker>
      <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc247"/></marker>
      <marker id="m-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8dcc0"/></marker>
      <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b5e"/></marker>
      <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3ada1"/></marker>
    </defs>

    <!-- ================= LEGEND ================= -->
    <g font-size="12" fill="#a3ada1">
      <line x1="1300" y1="38" x2="1340" y2="38" stroke="#3dff8b" stroke-width="2.5"/><text x="1351" y="42">request path, user to service</text>
      <line x1="1300" y1="58" x2="1340" y2="58" stroke="#ff9b3d" stroke-width="2.5"/><text x="1351" y="62">AI agent path, screened on the way out</text>
      <line x1="1300" y1="78" x2="1340" y2="78" stroke="#ff9b3d" stroke-width="2.5" stroke-dasharray="6 5"/><text x="1351" y="82">fallback on spend ceiling</text>
      <line x1="1300" y1="98" x2="1340" y2="98" stroke="#ffc247" stroke-width="2.5"/><text x="1351" y="102">detection and audit, shipped off-host</text>
      <line x1="1300" y1="118" x2="1340" y2="118" stroke="#e8dcc0" stroke-width="2.5"/><text x="1351" y="122">change path, pipeline only</text>
      <line x1="1300" y1="138" x2="1340" y2="138" stroke="#a3ada1" stroke-width="2"/><text x="1351" y="142">internal dependency</text>
      <line x1="1300" y1="158" x2="1340" y2="158" stroke="#ff6b5e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="1351" y="162">inbound SSH, break-glass</text>
      <rect x="1300" y="172" width="40" height="15" fill="none" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1351" y="184">external service</text>
    </g>

    <!-- ================= OUTSIDE ROW ================= -->
    <g font-size="16" font-weight="500" fill="#e6ebe4" text-anchor="middle">
      <g class="cd-node" data-node="users" tabindex="0" role="button" aria-label="users, operators: details"><rect x="180" y="30" width="200" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="280" y="55">users, operators</text></g>

      <g class="cd-node" data-node="claude-api" tabindex="0" role="button" aria-label="Claude API: details"><rect x="675" y="30" width="170" height="40" rx="5" fill="none" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="760" y="55">Claude API</text></g>

      <g class="cd-node" data-node="allowlisted-range" tabindex="0" role="button" aria-label="allowlisted source range: details"><rect x="900" y="30" width="230" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1015" y="55">allowlisted source range</text></g>
    </g>

    <!-- ================= EDGE ZONE ================= -->
    <rect x="120" y="100" width="480" height="105" rx="7" fill="rgba(61,255,139,0.03)" stroke="#27342b" stroke-width="1.5"/>
    <text x="138" y="120" font-size="12" font-weight="700" fill="#3dff8b" letter-spacing="2">CLOUDFLARE EDGE</text>
    <text x="138" y="136" font-size="11.5" fill="#a3ada1">off-host, identity checked before origin, WAF and DDoS, no origin address in DNS</text>
    <g font-size="16" font-weight="500" fill="#e6ebe4" text-anchor="middle">
      <g class="cd-node" data-node="access" tabindex="0" role="button" aria-label="Access: details"><rect x="180" y="150" width="150" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="255" y="175">Access</text></g>
      <g class="cd-node" data-node="waf" tabindex="0" role="button" aria-label="WAF + DDoS: details"><rect x="400" y="150" width="150" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="475" y="175">WAF + DDoS</text></g>
    </g>

    <!-- ================= HOST ================= -->
    <rect x="100" y="245" width="1320" height="435" rx="9" fill="rgba(255,255,255,0.018)" stroke="#35463b" stroke-width="2"/>
    <text x="120" y="268" font-size="12" font-weight="700" fill="#e6ebe4" letter-spacing="2">HOST, SINGLE HARDENED VM</text>
    <text x="120" y="284" font-size="11.5" fill="#a3ada1">published to loopback only</text>

    <!-- tunnel node -->
    <g font-size="16" font-weight="500" fill="#e6ebe4" text-anchor="middle">
      <g class="cd-node" data-node="cloudflared" tabindex="0" role="button" aria-label="cloudflared: details"><rect x="400" y="262" width="150" height="40" rx="5" fill="#141b16" stroke="#3dff8b" stroke-width="1.5"/>
      <text x="475" y="287">cloudflared</text></g>
    </g>
    <text x="560" y="287" font-size="11.5" fill="#a3ada1">host network, read-only root</text>

    <!-- host sshd tag on the boundary -->
    <g class="cd-node" data-node="host-sshd" tabindex="0" role="button" aria-label="host sshd: details"><rect x="975" y="234" width="80" height="22" rx="3" fill="#0a0d0b" stroke="#ff6b5e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1015" y="249" font-size="11.5" fill="#ff6b5e" text-anchor="middle">host sshd</text></g>

    <!-- ----- net-ai ----- -->
    <rect x="120" y="330" width="220" height="320" rx="7" fill="rgba(232,220,192,0.03)" stroke="#e8dcc0" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="136" y="352" font-size="12" font-weight="700" fill="#e8dcc0" letter-spacing="2">NET-AI, SEALED</text>
    <text x="136" y="368" font-size="11.5" fill="#a3ada1">no route in or out</text>
    <text x="136" y="383" font-size="11.5" fill="#a3ada1">n8n and Squire bridge in</text>
    <g font-size="16" font-weight="500" fill="#e6ebe4" text-anchor="middle">
      <g class="cd-node" data-node="whisper" tabindex="0" role="button" aria-label="Whisper: details"><rect x="155" y="395" width="150" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="230" y="420">Whisper</text></g>
      <g class="cd-node" data-node="ollama" tabindex="0" role="button" aria-label="Ollama: details"><rect x="155" y="505" width="150" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="230" y="530">Ollama</text></g>
    </g>
    <g font-size="11.5" fill="#a3ada1" text-anchor="middle">
      <text x="230" y="452">voice to text, on host</text>
      <text x="230" y="562">local LLM, sealed</text>
    </g>

    <!-- ----- net-core ----- -->
    <rect x="380" y="330" width="760" height="320" rx="7" fill="rgba(255,255,255,0.02)" stroke="#27342b" stroke-width="1.5"/>
    <text x="1124" y="352" font-size="12" font-weight="700" fill="#e6ebe4" letter-spacing="2" text-anchor="end">NET-CORE</text>
    <text x="1124" y="368" font-size="11.5" fill="#a3ada1" text-anchor="end">state, identity, orchestration</text>
    <g font-size="16" font-weight="500" fill="#e6ebe4" text-anchor="middle">
      <g class="cd-node" data-node="n8n" tabindex="0" role="button" aria-label="n8n: details"><rect x="420" y="395" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="490" y="420">n8n</text></g>
      <g class="cd-node" data-node="langfuse" tabindex="0" role="button" aria-label="Langfuse ×4: details"><rect x="600" y="395" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="670" y="420">Langfuse ×4</text></g>
      <g class="cd-node" data-node="vault" tabindex="0" role="button" aria-label="Vault: details"><rect x="780" y="395" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="850" y="420">Vault</text></g>
      <g class="cd-node" data-node="keycloak" tabindex="0" role="button" aria-label="Keycloak: details"><rect x="960" y="395" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1030" y="420">Keycloak</text></g>

      <g class="cd-node" data-node="squire" tabindex="0" role="button" aria-label="Squire: details"><rect x="420" y="505" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="490" y="530">Squire</text></g>
      <g class="cd-node" data-node="guardrails" tabindex="0" role="button" aria-label="Guardrails: details"><rect x="600" y="505" width="140" height="40" rx="5" fill="#141b16" stroke="#ff9b3d" stroke-width="1.5"/>
      <text x="670" y="530">Guardrails</text></g>
      <g class="cd-node" data-node="postgres" tabindex="0" role="button" aria-label="Postgres: details"><rect x="780" y="505" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="850" y="530">Postgres</text></g>
      <g class="cd-node" data-node="teleport" tabindex="0" role="button" aria-label="Teleport: details"><rect x="960" y="505" width="140" height="40" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1030" y="530">Teleport</text></g>
    </g>
    <g font-size="11.5" fill="#a3ada1">
      <text x="490" y="452" text-anchor="middle">SOAR, bridge to net-ai</text>
      <text x="920" y="452" text-anchor="end">secrets, AppRole</text>
      <text x="1100" y="452" text-anchor="end">OIDC, realm roles</text>
      <text x="490" y="562" text-anchor="middle">SOC agent, allowlist</text>
      <text x="670" y="562" text-anchor="middle">PII, injection, policy</text>
      <text x="850" y="562" text-anchor="middle">backs five services</text>
      <text x="1030" y="562" text-anchor="middle">recorded SSH, MFA, JIT</text>
    </g>
    <text x="760" y="628" font-size="11.5" fill="#a3ada1" text-anchor="middle">every service: no-new-privileges (Falco excepted, documented), CPU, memory, and PID limits</text>

    <!-- ----- net-monitoring ----- -->
    <rect x="1180" y="330" width="220" height="320" rx="7" fill="rgba(255,194,71,0.02)" stroke="#27342b" stroke-width="1.5"/>
    <text x="1196" y="352" font-size="12" font-weight="700" fill="#e6ebe4" letter-spacing="2">NET-MONITORING</text>
    <text x="1196" y="368" font-size="11.5" fill="#a3ada1">reads the kernel via eBPF</text>
    <text x="1196" y="383" font-size="11.5" fill="#a3ada1">audit shipper also on net-core</text>
    <g font-size="15" font-weight="500" fill="#e6ebe4" text-anchor="middle">
      <g class="cd-node" data-node="falco" tabindex="0" role="button" aria-label="Falco, eBPF: details"><rect x="1215" y="400" width="150" height="38" rx="5" fill="#141b16" stroke="#ffc247" stroke-width="1.5"/>
      <text x="1290" y="424">Falco, eBPF</text></g>
      <g class="cd-node" data-node="falcosidekick" tabindex="0" role="button" aria-label="Falcosidekick: details"><rect x="1215" y="456" width="150" height="38" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1290" y="480">Falcosidekick</text></g>
      <g class="cd-node" data-node="event-handler" tabindex="0" role="button" aria-label="event handler: details"><rect x="1215" y="512" width="150" height="38" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1290" y="536">event handler</text></g>
      <g class="cd-node" data-node="fluentd" tabindex="0" role="button" aria-label="Fluentd: details"><rect x="1215" y="568" width="150" height="38" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1290" y="592">Fluentd</text></g>
      <g class="cd-node" data-node="datadog-agent" tabindex="0" role="button" aria-label="Datadog agent: details"><rect x="1215" y="624" width="150" height="38" rx="5" fill="#141b16" stroke="#2c3a30" stroke-width="1.5"/>
      <text x="1290" y="648">Datadog agent</text></g>
    </g>

    <!-- ----- external: backups and SIEM ----- -->
    <g class="cd-node" data-node="object-storage" tabindex="0" role="button" aria-label="Object storage: details"><rect x="1470" y="250" width="180" height="120" rx="6" fill="none" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g text-anchor="middle">
      <text x="1560" y="296" font-size="15" font-weight="500" fill="#e6ebe4">Object storage</text>
      <text x="1560" y="314" font-size="11.5" fill="#a3ada1">state + backups</text>

      var li = el('li'); li.appendChild(link(SSP + '#L' + c.line, c.id, 'cd-node-id')); li.appendChild(el('span', null, c.name)); li.appendChild(el('em', null, 'SSP: ' + c.status)); parts.controls.appendChild(li);
    });
    parts.evidence.textContent = '';
    node.evidence.forEach(function(e) {
      var li = el('li'); li.appendChild(link(REPO + e.path + anchor(e.line), e.label)); li.appendChild(el('span', 'cd-node-path', e.path + ':' + e.line)); parts.evidence.appendChild(li);
    });
    if (active) active.classList.remove('active');
    // open on the side away from the box, so the box and its neighbours stay visible
    var r = g.getBoundingClientRect(); panel.classList.toggle('left', (r.left + r.width / 2) > window.innerWidth / 2);
    active = g; g.classList.add('active'); panel.classList.add('open'); parts.close.focus();
  }
  function hide() {
    if (!panel || !panel.classList.contains('open')) return;
    panel.classList.remove('open'); var g = active; if (g) g.classList.remove('active'); active = null; if (g && g.focus) g.focus();
  }
  document.querySelectorAll('script[type="application/json"][id^="cd-nodes-"]').forEach(function(s) {
    var data; try { data = JSON.parse(s.textContent); } catch (e) { return; }
    var fig = s.closest('figure'); if (!fig) return;
    var byId = {}; data.forEach(function(n) { byId[n.id] = n; });
    fig.querySelectorAll('.cd-node').forEach(function(g) {
      var n = byId[g.getAttribute('data-node')]; if (!n) return;
      function toggle(e) { e.preventDefault(); e.stopPropagation(); if (active === g) hide(); else show(n, g); }
      g.addEventListener('click', toggle);
      g.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') toggle(e); });
    });
  });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hide(); });
  document.addEventListener('click', function(e) { if (panel && panel.classList.contains('open') && !panel.contains(e.target) && !(active && active.contains(e.target))) hide(); });
})();
</script>
</body>
</html>
